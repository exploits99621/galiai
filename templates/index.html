<body>
    <div class="chat-container">
        <div class="header">
            <div class="header-left">
                <h1>
                    <i class="fas fa-skull"></i> 
                    Satvir AI
                </h1>
                <span class="header-sub">
                    <span class="dot"></span>
                    🔥 Gaali Mode
                </span>
            </div>
            <div class="developer-badge">
                <i class="fas fa-code"></i>
                Developer: <strong>Satvir</strong>
                <i class="fas fa-crown" style="margin-left: 4px;"></i>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="msg msg-bot">
                <span class="sender-label">🤬 Satvir AI</span>
                Arre chutiye! Welcome to Satvir AI. Bol kya chahiye? 🤬⚡🖕<br>
                <span style="font-size:0.8rem; opacity:0.6;">💀 Main gaali dunga, roast karunga, aur help bhi karunga!</span>
                <span class="time">just now</span>
            </div>
        </div>
        
        <div class="typing" id="typing">
            <span style="display:flex; align-items:center; gap:8px;">
                💀 Satvir soch raha hai...
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </span>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Bhai, bol kya gaali dega? 🔥" autofocus>
            <button id="sendBtn">
                <i class="fas fa-bolt"></i> Bhej
            </button>
        </div>
    </div>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script>
        // ====== DOM References ======
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');
        
        // ====== Helper Functions ======
        function addMessage(text, sender = 'bot') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg msg-${sender}`;
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const label = document.createElement('span');
            label.className = 'sender-label';
            label.textContent = sender === 'user' ? '👤 Tu' : '🤬 Satvir AI';
            msgDiv.appendChild(label);
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            msgDiv.appendChild(textSpan);
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.textContent = timeStr;
            msgDiv.appendChild(timeSpan);
            
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function showTyping(show) {
            typing.classList.toggle('show', show);
            if (show) {
                messages.scrollTop = messages.scrollHeight;
            }
        }
        
        function setLoading(loading) {
            sendBtn.disabled = loading;
            userInput.disabled = loading;
            if (loading) {
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            } else {
                sendBtn.innerHTML = '<i class="fas fa-bolt"></i> Bhej';
            }
        }
        
        // ====== Send Message ======
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            // Add user message
            addMessage(text, 'user');
            userInput.value = '';
            
            // Show loading state
            showTyping(true);
            setLoading(true);
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                showTyping(false);
                
                if (data.error) {
                    addMessage(`❌ Error: ${data.error}`, 'bot');
                } else {
                    addMessage(data.reply, 'bot');
                }
            } catch (error) {
                showTyping(false);
                addMessage(`❌ Network Error: ${error.message}`, 'bot');
            }
            
            setLoading(false);
            userInput.focus();
        }
        
        // ====== Event Listeners ======
        sendBtn.addEventListener('click', sendMessage);
        
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // ====== Auto-focus on load ======
        window.addEventListener('load', () => {
            userInput.focus();
        });
    </script>
